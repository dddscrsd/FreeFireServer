// center/list opens; the response's two lists set IsRoomCreateRulesInited +
// IsRoomCreateRuleDropInited, which gate UIRoomListController::OnBtnRoomCreate. Without it the
// Create button does nothing for Normal/League (Pet Rumble/Mania bypass the gate, client-baked).
// Fields recovered from the il2cpp RoomCreateRuleRes/Desc/DropDesc metadata (declaration order
// == field number).
message RoomCreateRuleDesc {
  uint32 map_id = 1;
  uint32 game_mode = 2;
  uint32 group_mode = 3;            // 0=Solo,1=Duo,3=Squad/Quad,5=Hexa
  repeated uint32 members = 4;      // selectable member counts (members[0] = default); MUST be non-empty
  repeated uint32 spectators = 5;   // selectable spectator counts; MUST be non-empty
  uint32 room_type = 6;             // 1=Casual/Normal, 2=League
  uint32 min_member_cnt = 7;
  bool enable_voice_chat = 8;
}

message RoomCreateRuleDropDesc {
  uint32 id = 1;
  string suffix = 2;
  uint32 room_type = 3;
  string loc_key = 4;
  int32 unlimited_ammo_switch = 5;
  int32 air_drop_switch = 6;
  int32 loadout_switch = 7;
  int32 car_drop_switch = 8;
  uint32 drop_type = 9;             // 1=CS list, 2=Bomb list, else generic
  int32 air_ship_switch = 10;
  int32 ban_gun_skin_attr = 11;
  int32 hide_enemy_fashion = 12;
  int32 friendly_fire = 13;
  int32 hide_hud = 14;
  uint32 revival = 15;
  string describe_key = 16;
}

// NOTE the tags: room_create_rules = 1, room_create_rule_drops = 2. The il2cpp field OFFSET
// order is drops-then-rules, but the client's protobuf-net [ProtoMember] tags are the REVERSE:
// verified empirically — a subcmd-32 reply with drops=1 makes the client parse our DropDesc
// bytes as a RoomCreateRuleDesc and throw "Invalid wire-type" at EnumSerializer (RuleDesc.field2
// game_mode is an enum; DropDesc.field2 suffix is a string). So rules MUST be tag 1.
message RoomCreateRuleRes {
  repeated RoomCreateRuleDesc room_create_rules = 1;
  repeated RoomCreateRuleDropDesc room_create_rule_drops = 2;
}

